# === PRODUCT_BASIS ===
# pb_tolerance / pb_lcutmx : ctrlg.<sname>.toml (cut-off tunables).
# nlx / valence / core     : PB.<sname>.toml (per-spec tables).
[product_basis]
pb_tolerance = [0.001]                     # drop linearly-dep products below this (default 1e-3)
pb_lcutmx    = [2, 2, 4, 4, 4, 4, 2, 2, 2, 2, 2, 2, 2, 2]  # max l-cutoff per atom (4 for d-valence, 6 for f)

