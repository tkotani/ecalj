# ctrlg.<sname>.toml -- auto-generated by ctrl2ctrltoml.py (v2)
# Schema-typed TOML; m_lmfinit reads it via m_ctrl_toml_loader.
# Inline comments come from toml_comments.py (edit there to update).

# === Top-level keys ===
# symgrp: 'find' lets lmf detect maximum space-group symmetry from
#   lattice + species. Set explicitly (e.g. 'r4z r3d r2x') to lower
#   the symmetry by hand. 'lmchk foobar --ctrlg:verbose=60' lists generators.
#   See https://ecalj.github.io/ecaljdoc/manual/lmf#symgrp
# verbose / time: console verbosity and CPU timing log.
#   Override at run time with --ctrlg:verbose=50 / --ctrlg:time=[5,5].
symgrp = "find"  # 'find' = auto-detect from lattice (see header)
symgrpaf = "r2z:( 0 0 0.5 )"
verbose = 35  # 31 default, 35 verbose, 41+ debug
time = [0, 0]  # CPU timing log; [depth, on-the-fly]

# === STRUC: lattice ===
# alat in a.u.; plat is the primitive cell in units of alat (rows = a1,a2,a3).
# nbas/nspec are filled automatically from the [[site]]/[[spec]] arrays.
[struc]
nspec = 3
nbas  = 4
alat  = 10.0722442585141  # lattice constant (a.u.)
plat  = [[ 0.686679190581614,               0.0, 0.0],  # primitive vectors in units of alat
         [-0.343339595290807, 0.594681623302064, 0.0],
         [               0.0,               0.0, 1.0]]

# === SITE: atomic positions ===
# Each [[site]] table is one atom. xpos = fractional coords in plat;
# pos = Cartesian coords in units of alat (use one or the other).
[[site]]   # @1
atom = "Niup"
pos  = [0.0, 0.0, 0.0]
af   = 1
# ----------------------------------------------------------------
[[site]]   # @2
atom = "Nidn"
pos  = [0.0, 0.0, 0.5]
af   = -1
# ----------------------------------------------------------------
[[site]]   # @3
atom = "Se"
pos  = [              0.0, 0.396454401313321,              0.25]
# ----------------------------------------------------------------
[[site]]   # @4
atom = "Se"
pos  = [0.343339587242026, 0.198227178236398,              0.75]

# === SPEC: per-species parameters ===
# Touch mainly mmom (initial magnetic moment, NSPIN=2),
# idu/uh/jh (LDA+U), and rsmh/eh (smoothed-Hankel basis).
# kmxa = radial expansion order at tail sites (default 5).
# Rule of thumb: kmxa > pwemax (in Ry). r = MT radius (a.u.).
# NOTE: legacy IDU=(0,0,12) UH=0 removed 2026-08-19: idu>=10 together with
# symgrpaf crashes zhev_tk4 (nev/=nevout) in the current code; with U=0 the
# LDA+U block was a no-op anyway. See Samples/README Known issues.
[[spec]]   # @1
atom   = "Niup"
z      = 28
r      = 2.22
rsmh   = [1.11, 1.11, 1.11, 1.11]
eh     = [-1.0, -1.0, -1.0, -1.0]
rsmh2  = [1.11, 1.11, 1.11]
eh2    = [-2.0, -2.0, -2.0]
lmx    = 3
lmxa   = 4
mmom   = [0.0, 0.0, 1.2]
nmcore = 1
kmxa   = 5
# ----------------------------------------------------------------
[[spec]]   # @2
atom   = "Nidn"
z      = 28
r      = 2.22
rsmh   = [1.11, 1.11, 1.11, 1.11]
eh     = [-1.0, -1.0, -1.0, -1.0]
rsmh2  = [1.11, 1.11, 1.11]
eh2    = [-2.0, -2.0, -2.0]
lmx    = 3
lmxa   = 4
mmom   = [ 0.0,  0.0, -1.2]
nmcore = 1
kmxa   = 5
# ----------------------------------------------------------------
[[spec]]   # @3
atom   = "Se"
z      = 34
r      = 2.36
rsmh   = [1.18, 1.18, 1.18, 1.18]
eh     = [-1.0, -1.0, -1.0, -1.0]
rsmh2  = [1.18, 1.18, 1.18]
eh2    = [-2.0, -2.0, -2.0]
lmx    = 3
lmxa   = 4
mmom   = [0.0, 0.0, 0.0, 0.0]
nmcore = 1
kmxa   = 5

# === BZ: Brillouin-zone integration ===
# nkabc = k-mesh divisions (1 entry -> isotropic, 3 entries -> per axis).
# metal=3 + tetra=true is the safe default for metals.
# For molecules in a cell use tetra=false, n=-1, w=0.001 (~157K).
# fsmom (fixed-spin moment) constrains total magnetic moment when set.
#   FSMOMMETHOD=0 solids, =1 discrete (LUMO-HOMO bias). Cannot mix with so=1.
[bz]
nkabc       = [8, 8, 8]  # k-mesh divisions
metal       = 3  # 0 insulator, 3 tetra+broadening (safe metal default)
savdos      = true  # write DOS files
npts        = 2001  # division of DOS plot (larger = finer)
dosmax      = 1.5
fsmom       = 0.0
fsmommethod = 0

# === ITER: self-consistency ===
# mix:  'A#' Anderson (stable), 'B#'/'B3' Broyden (faster, default).
#       The trailing digit is history length kept (e.g. B3 = keep 3).
# b:    mixing ratio (smaller -> stable but slower convergence).
# conv: max |dE| between iterations.  convc: max d(rho_out - rho_in).
# umix/tolu: LDA+U density-matrix mixing parameters.
[iter]
nit   = 100  # max self-consistency iterations
mix   = "A2"  # B3 = Broyden hist=3 (default); A3 = Anderson hist=3
conv  = 1e-05  # max dE between iterations (Ry)
convc = 1e-05  # max d(rho_out - rho_in) (Ry)
b     = 0.3  # mixing ratio (smaller -> more stable)

# === HAM: Hamiltonian / basis ===
# nspin: 1 nonmagnetic, 2 spin-polarized (set spec.mmom for guess).
# rel:   scalar-relativistic Schroedinger equation (default true).
# xcfun: 1=VWN, 2=Barth-Hedin, 103=PBE-GGA.
# gmax / ftmesh: real-space mesh for charge density. Use one.
#   If gmax is set, ftmesh is auto-derived. Watch sugcut output: it
#   reports the gmax actually required for the given tol.
# pwmode: 0=MTO only (LMTO), 1=APW+MTO (PMT, |G|cut), 2=APW only,
#         11=APW+MTO with |q+G|cut (recommended), 12=LAPW.
#   GW driver (--jobgw) forces 11 internally.
# pwemax (Ry): APW cutoff; large values may need larger spec.kmxa.
# oveps: drop near-linear-dependent basis in (H-eO)z=0 diagonalisation.
#   Default 1d-8.  Use 1d-6 if pwemax is large and basis is over-complete.
# so: 0 no SO, 1 add L.S to H, 2 add Lz.Sz only (collinear).
# scaledsigma: QSGW mixing factor.  1.0 = full QSGW, 0.8 = QSGW80.
# readp / readpskipf / pnufix:
#   readp=true reads P,PZ from atom-calculation results;
#   pnufix=true freezes log-derivative B.C. of radial functions.
# forces: 0 no force calc, 1 compute Hellmann-Feynman forces.
[ham]
nspin       = 2  # 1 nonmag, 2 spin-polarized
rel         = true  # scalar-relativistic
so          = 0  # 0 none, 1 L.S, 2 Lz.Sz
gmax        = 15.0  # real-space mesh G-cutoff (Ry); alt: ftmesh
frzwf       = false  # freeze wavefunctions
xcfun       = 1  # 1=VWN, 2=Barth-Hedin, 103=PBE-GGA
forces      = 0  # 0 none, 1 compute forces
rdsig       = 12
scaledsigma = 0.8  # QSGW mixing: 1.0 full, 0.8 = QSGW80
oveps       = 1e-08  # overlap-eps for (H-eO)z=0; 1d-8 default
pwmode      = 11  # 0=MTO 1=PMT 2=APW 11=PMT(|q+G|, default) 12=LAPW
pwemax      = 3.0  # APW cutoff (Ry)
readp       = true  # read P,PZ from atom calc results
pnufix      = true  # fix B.C. of radial functions
phispinsym  = false  # true = spin-averaged radial wfns (needed for SOC=1 perturbation)
