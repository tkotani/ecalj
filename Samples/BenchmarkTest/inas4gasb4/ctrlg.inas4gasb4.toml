# === BZ: Brillouin-zone integration ===
# nkabc = k-mesh divisions (1 entry -> isotropic, 3 entries -> per axis).
# metal=3 + tetra=true is the safe default for metals.
# For molecules in a cell use tetra=false, n=-1, w=0.001 (~157K).
# fsmom (fixed-spin moment) constrains total magnetic moment when set.
#   FSMOMMETHOD=0 solids, =1 discrete (LUMO-HOMO bias). Cannot mix with so=1.
[bz]
nkabc  = [8, 8, 4]  # k-mesh divisions
metal  = 3  # 0 insulator, 3 tetra+broadening (safe metal default)
tetra  = true  # true = tetrahedron BZ integration
n      = -1
w      = 0.01  # energy broadening (Ry); 0.002 ~ 0.01
savdos = true  # write DOS files
npts   = 2001  # division of DOS plot (larger = finer)
dosmax = 1.5

# === ITER: self-consistency ===
# mix:  'A#' Anderson (stable), 'B#'/'B3' Broyden (faster, default).
#       The trailing digit is history length kept (e.g. B3 = keep 3).
# b:    mixing ratio (smaller -> stable but slower convergence).
# conv: max |dE| between iterations.  convc: max d(rho_out - rho_in).
# umix/tolu: LDA+U density-matrix mixing parameters.
[iter]
nit   = 80  # max self-consistency iterations
mix   = "B3"  # B3 = Broyden hist=3 (default); A3 = Anderson hist=3
conv  = 1e-05  # max dE between iterations (Ry)
convc = 1e-05  # max d(rho_out - rho_in) (Ry)
umix  = 0.2  # LDA+U density-matrix mixing parameter
b     = 0.2  # mixing ratio (smaller -> more stable)

# === HAM: Hamiltonian / basis ===
# nspin: 1 nonmagnetic, 2 spin-polarized (set spec.mmom for guess).
# rel:   scalar-relativistic Schroedinger equation (default true).
# xcfun: 1=VWN, 2=Barth-Hedin, 103=PBE-GGA.
# gmax / ftmesh: real-space mesh for charge density. Use one.
#   If gmax is set, ftmesh is auto-derived. Watch sugcut output: it
#   reports the gmax actually required for the given tol.
# pwmode: 0=MTO only (LMTO), 1=APW+MTO (PMT, |G|cut), 2=APW only,
#         11=APW+MTO with |q+G|cut (recommended), 12=LAPW.
#   GW driver (--jobgw) forces 11 internally.
# pwemax (Ry): APW cutoff; large values may need larger spec.kmxa.
# oveps: drop near-linear-dependent basis in (H-eO)z=0 diagonalisation.
#   Default 1d-8.  Use 1d-6 if pwemax is large and basis is over-complete.
# so: 0 no SO, 1 add L.S to H, 2 add Lz.Sz only (collinear).
# scaledsigma: QSGW mixing factor.  1.0 = full QSGW, 0.8 = QSGW80.
# readp / readpskipf / pnufix:
#   readp=true reads P,PZ from atom-calculation results;
#   pnufix=true freezes log-derivative B.C. of radial functions.
# forces: 0 no force calc, 1 compute Hellmann-Feynman forces.
[ham]
phispinsym = false  # spin-averaged radial wfns (needed for SO=1 perturbation)
nspin       = 1  # 1 nonmag, 2 spin-polarized
rel         = true  # scalar-relativistic
so          = 0  # 0 none, 1 L.S, 2 Lz.Sz
gmax        = 12.0  # real-space mesh G-cutoff (Ry); alt: ftmesh
frzwf       = false  # freeze wavefunctions
xcfun       = 1  # 1=VWN, 2=Barth-Hedin, 103=PBE-GGA
forces      = 0  # 0 none, 1 compute forces
rdsig       = 12
scaledsigma = 0.8  # QSGW mixing: 1.0 full, 0.8 = QSGW80
oveps       = 1e-08  # overlap-eps for (H-eO)z=0; 1d-8 default
pwmode      = 1  # 0=MTO 1=PMT 2=APW 11=PMT(|q+G|, default) 12=LAPW
pwemax      = 3.0  # APW cutoff (Ry)
readp       = true  # read P,PZ from atom calc results
pnufix      = true  # fix B.C. of radial functions

# === GW: driver (used by lmf --jobgw=N and gwsc) ===
# nband_chi0/emax_chi0: bands/energy window for chi0.
# Touch only if you know what you are doing -- defaults are sensible.
[gw]
n1n2n3        = [4, 4, 1]  # BZ mesh for GW
QpGcut_psi    = 3.0        # |q+G| cutoff for eigenfunctions (a.u. unless unit_2pioa=true)
QpGcut_cou    = 2.5        # |q+G| cutoff for Coulomb / W
unit_2pioa    = false      # false: a.u.;  true: 2*pi/alat
alpha_OffG    = 1.0        # offset-Gamma auxiliary function (dimensionless)
emax_sigm     = 2.0        # (Ry) Sigma exact below; extrapolated above
HistBin_dw    = 0.002      # bin width on real-axis at omega=0
HistBin_ratio = 1.08       # frhis(iw)=(dw/(r-1))*(exp((r-1)*(iw-1))-1)
iSigMode      = 3          # self-energy mode flag (3 = standard QSGW)
niw           = 10         # # of imag-axis frequencies (try 6/10/12)
delta         = -1e-06     # (Ry) small imaginary shift (~1e-6)
deltaw        = 0.02       # (a.u.) numerical-derivative mesh for Z factor
esmr          = 0.003      # (Ry) hsfp0 smearing; keep < band gap for insulators
GaussSmear    = true       # Gaussian smearing for poles of G^LDA in hsfp0
keepEigen     = false
zmel_batch_gb = 4
QforEPSunita  = true
EMAXforGW     = 5          # (eV, rel. EFermi) upper band cutoff for GW Sigma
