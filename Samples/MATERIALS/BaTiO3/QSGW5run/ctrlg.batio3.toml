  8     0.5000000000000000     0.2500000000000000     0.2500000000000000
  9     0.5000000000000000     0.5000000000000000     0.2500000000000000
 10     0.5000000000000000     0.5000000000000000     0.5000000000000000
"""

# === PRODUCT_BASIS ===
# pb_tolerance / pb_lcutmx : the cut-offs you may tune.
