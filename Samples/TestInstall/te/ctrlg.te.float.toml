nspec = 2
nbas  = 12
alat  = 8.234  # lattice constant (a.u.)
plat  = [[ 1.0,               0.0,   0.0],  # primitive vectors in units of alat
         [-0.5, 0.866025403784439,   0.0],
         [ 0.0,               0.0, 1.136]]

