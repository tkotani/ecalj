nspec = 4
nbas  = 40
alat  = 11.492328042328  # lattice constant (a.u.)
plat  = [[ 0.5, 0.5,              0.0],  # primitive vectors in units of alat
         [-0.5, 0.5,              0.0],
         [ 0.0, 0.0, 9.94493413790773]]

