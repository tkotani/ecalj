# Schema-typed TOML; m_lmfinit reads it via m_ctrl_toml_loader.
# Inline comments come from toml_comments.py (edit there to update).

# === Top-level keys ===
# symgrp: 'find' lets lmf detect maximum space-group symmetry from
#   lattice + species. Set explicitly (e.g. 'r4z r3d r2x') to lower
#   the symmetry by hand. 'lmchk foobar --ctrlg:verbose=60' lists generators.
#   See https://ecalj.github.io/ecaljdoc/manual/lmf#symgrp
# verbose / time: console verbosity and CPU timing log.
#   Override at run time with --ctrlg:verbose=50 / --ctrlg:time=[5,5].
symgrp = "find"  # 'find' = auto-detect from lattice (see header)
verbose = 35  # 31 default, 35 verbose, 41+ debug
time = [0, 0]  # CPU timing log; [depth, on-the-fly]

# === STRUC: lattice ===
# alat in a.u.; plat is the primitive cell in units of alat (rows = a1,a2,a3).
# nbas/nspec are filled automatically from the [[site]]/[[spec]] arrays.
[struc]
nspec = 3
nbas  = 14
alat  = 15.8793749539379  # lattice constant (a.u.)
plat  = [[0.0, 0.5, 0.5],  # primitive vectors in units of alat
         [0.5, 0.0, 0.5],
         [0.5, 0.5, 0.0]]

