[DEFAULT]
inpath = xxx
epath  = xxx
nqsub = 2
niter = 2
ncore = 16
bnd4all = True
gw80 = False
koption = 8
kratio = 4/8
kkmesh = xxx
ldaonly = False
# Not need to modify xxx above since you can supply them by auguments for jobsubmission.

# The Materials Project API key is not here (this file is in the repository): put it in <ecalj>/MaterialProject.key
#           (see <ecalj>/MaterialProject.key.example) or set MP_API_KEY (2026-10-01).
# nqsub   : Number of qsub jobs	     
# ncore   : Number of cores per qsub. Thus we occupy nqsub \times ncore.
# niter   : Number of QSGW iteration     
# bnd4all : Generate band plot	     
# gw80    : Run QSGW80. QSGW100,otherwise
# koption : k-mesh for Si. 8 means default for Si is 8x8x8 
# kratio  : k-mesh ratio for QSGW relative tor LDA. 4/8 means default is 4x4x4 for Si for 8x8x8
